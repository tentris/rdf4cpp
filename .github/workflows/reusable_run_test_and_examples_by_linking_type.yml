on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      compiler:
        required: true
        type: string
      cmake-version:
        required: true
        type: string
      conan-version:
        required: true
        type: string
      build-shared-libs:
        required: true
        type: boolean
      with-coverage:
        type: boolean
      with-sanitizer:
        type: boolean
    secrets:
      coverall-token:
        description: 'Access token for coverall. Required if inputs.with-coverage'
        required: false

jobs:
  tests-and-examples:
    name: ${{ fromJSON('["static", "shared"]')[inputs.build-shared-libs] }} lib${{ fromJSON('["", " + sanitizers"]')[inputs.with-sanitizer] }}${{ fromJSON('["", " + code coverage"]')[inputs.with-coverage] }}${{ fromJSON('["", " + AVX"]')[inputs.with-AVX] }}
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Add compiler repos
        if: ${{ !contains(inputs.os, 'macos') }}
        uses: dice-group/cpp-conan-release-reusable-workflow/.github/actions/setup_apt@v2.1.1

      - name: Setup env vars for macos
        if: ${{ contains(inputs.os, 'macos') }}
        run: |
          CC_VER="${{ inputs.compiler }}"
          if [[ ${CC_VER:0:4} != gcc- ]] ; then exit 1; fi
          GCC_VERSION=${CC_VER:4:6}
          echo GCC_VERSION="${GCC_VERSION}" >> $GITHUB_ENV

          if [[ "${{ inputs.os }}" == "macos-15" ]]; then
            echo MACPORTS_VERSION=2.10.7 >> $GITHUB_ENV
          fi

      - name: Cache MacPorts
        if: ${{ contains(inputs.os, 'macos-15') }}
        uses: actions/cache@v6.1.0
        id: cache-macports
        with:
          path: /opt/local/
          key: macports-${{ env.MACPORTS_VERSION }}-${{ inputs.os }}-${{ inputs.compiler }}

      - name: Fix MacPorts permissions
        if: ${{ contains(inputs.os, 'macos-15') && steps.cache-macports.outputs.cache-hit == 'true' }}
        run: sudo chown -R root:wheel /opt/local

      - name: Install MacPorts
        if: ${{ contains(inputs.os, 'macos-15') && steps.cache-macports.outputs.cache-hit != 'true' }}
        run: |
          curl -LO "https://github.com/macports/macports-base/releases/download/v${MACPORTS_VERSION}/MacPorts-${MACPORTS_VERSION}-15-Sequoia.pkg"
          sudo installer -pkg "MacPorts-${MACPORTS_VERSION}-15-Sequoia.pkg" -target /

      - name: Add MacPorts to system paths
        if: ${{ contains(inputs.os, 'macos-15') }}
        run: |
          # so sudo can find port
          echo "/opt/local/bin" | sudo tee -a /etc/paths
          echo "/opt/local/sbin" | sudo tee -a /etc/paths
          # also ensure it’s in the user path
          echo "/opt/local/bin" >> $GITHUB_PATH

      - name: Update MacPorts
        if: ${{ contains(inputs.os, 'macos-15') && steps.cache-macports.outputs.cache-hit != 'true' }}
        run: |
          sudo port -v selfupdate
          sudo port install "gcc${GCC_VERSION}"
          sudo port select --set gcc "mp-gcc${GCC_VERSION}"
          hash -r
      - name: Set env vars
        if: ${{ contains(inputs.os, 'macos-15') }}
        run: |
          echo CC="$(which gcc)" >> $GITHUB_ENV
          echo CXX="$(which g++)" >> $GITHUB_ENV

      - name: Set env vars (macos-26)
        if: ${{ contains(inputs.os, 'macos-26') }}
        run: |
          # MacPorts gcc15 is 15.2.0 and cannot compile the macOS 26 SDK headers
          # (_Static_assert in mach/message.h is rejected by gcc < 15.3 in C++).
          # The runner image preinstalls Homebrew GCC 15.3.0 as gcc-15, use that.
          echo CC="gcc-${GCC_VERSION}" >> $GITHUB_ENV
          echo CXX="g++-${GCC_VERSION}" >> $GITHUB_ENV

      - name: Get minimum cmake version
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: ${{ inputs.cmake-version }}

      - name: Install compiler
        id: install_cc
        if: ${{ !contains(inputs.os, 'macos') }}
        uses: rlalik/setup-cpp-compiler@v2
        with:
          compiler: ${{ inputs.compiler }}

      - name: use mold as default linker
        if: ${{ !contains(inputs.os, 'macos') }}
        uses: rui314/setup-mold@v1

      - name: Configure conan
        uses: dice-group/cpp-conan-release-reusable-workflow/.github/actions/configure_conan@v2.1.1
        with:
          conan-version: ${{ inputs.conan-version }}

      - name: add conan user
        run: |
          conan remote add -f dice-group https://conan.dice-research.org/artifactory/api/conan/tentris

      - name: Cache conan data
        id: cache-conan
        uses: actions/cache@v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ inputs.os }}-${{ inputs.compiler }}-conan2-${{ fromJSON('["nocoverage", "coverage"]')[inputs.with-coverage] }}-${{ fromJSON('["nosanitizer", "sanitizer"]')[inputs.with-sanitizer] }}-${{ fromJSON('["noavx", "avx"]')[inputs.with-avx] }}

      - name: install gcovr
        if: inputs.with-coverage
        run: |
          pip3 install gcovr

      - name: Check out sources
        uses: actions/checkout@v7.0.1

      - name: Select preset
        run: |
          PRESET="ci-${{ fromJSON('["static", "shared"]')[inputs.build-shared-libs] }}${{ fromJSON('["", "-sanitizer"]')[inputs.with-sanitizer] }}${{ fromJSON('["", "-coverage"]')[inputs.with-coverage] }}"
          echo PRESET="${PRESET}" >> $GITHUB_ENV
          echo CTEST_PARALLEL_LEVEL="$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)" >> $GITHUB_ENV

      - name: Set compiler env vars
        if: ${{ !contains(inputs.os, 'macos') }}
        run: |
          echo CC="${{ steps.install_cc.outputs.cc }}" >> $GITHUB_ENV
          echo CXX="${{ steps.install_cc.outputs.cxx }}" >> $GITHUB_ENV

      - name: Set compiler flags (macos)
        if: ${{ contains(inputs.os, 'macos') }}
        run: |
          echo CXXFLAGS="-march=armv8-a+aes+sha2" >> $GITHUB_ENV

      - name: Cache parser tests
        id: cache-parser
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/${{ env.PRESET }}/tests/xml_test_cache
            build/${{ env.PRESET }}/tests/jsonld_test_cache
          # the test sources list the files to download, so their hash changes when the set changes.
          # actions/cache only writes on an exact key miss, a constant key would freeze the cache forever.
          key: parser_test-${{ hashFiles('tests/parser/tests_XMLParser.cpp', 'tests/parser/tests_JSON_LD_Parser.cpp') }}
          restore-keys: parser_test-

      # configure, build and test, all from CMakePresets.json
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ env.PRESET }}

      - name: Report coverage
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.coverall-token }}
          GCOV_COMPILER: ${{ inputs.compiler }}
        if: inputs.with-coverage
        run: |
          gcovr --gcov-executable "gcov-${GCOV_COMPILER#gcc-}" --coveralls --filter 'src/' -o coverage.json -r ./
          curl -F "json_file=@coverage.json" https://coveralls.io/api/v1/jobs

      - name: Run examples
        working-directory: build/${{ env.PRESET }}/examples
        run: |
          for example in *_example; do 
            echo "executing ${example}"
            ./${example}
          done
